version: 1

# Where all binder_*/ directories and YAMLs will be written
output_dir: ./boltz_validation

global:
  boltz:
    recycling_steps: 10
    diffusion_samples: 5
    use_msa_server: true

visualisation:
  ipsae_error_threshold: 15
  ipsae_distance_threshold: 15
  use_best_model: false # plots avg across all models if false
  num_cpu: 50

binders:
  - from_dir: binders/
    chains_msa:
      0: empty
      1: empty
targets:
  - name: nipah_g
    role: target
    sequences:
      - 
    chains_msa:
      0: nipah.a3m
    # cif_template: path_to_cif_template/target.cif
      
  - name: Sialidase_2F29
    role: antitarget
    sequences:
      - 
    # cif_template: path_to_cif_template/target.cif
  - name: self
    role: self
    chains_msa:
      0: empty
      1: empty